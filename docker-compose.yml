services:
  postgres-nfe:
    image: postgres:16-alpine
    container_name: microled-nfe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: amktech
      POSTGRES_PASSWORD: Index@!1212
      POSTGRES_DB: DB_NFE
    ports:
      - "5433:5432"
    volumes:
      - nfe_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nfe_postgres_data:
